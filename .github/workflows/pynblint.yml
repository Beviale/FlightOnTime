name: Lint Notebooks (Pynblint)

on:
  pull_request:
    paths:
      - 'notebooks/**/*.ipynb'

permissions:
  contents: read

jobs:
  pynblint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}


      - name: Run pynblint
        run: |
          uvx --from pynblint \
            --with "click<8.2" \
            --with "typer<0.12" \
            --with "lxml[html_clean]" \
            pynblint notebooks/ > pynblint_report.txt 2>&1 || true
          cat pynblint_report.txt

      - name: Report the violations
        run: |
          if grep -qiE "Traceback|ImportError|ModuleNotFoundError" pynblint_report.txt; then
            echo "pynblint itself failed to run."
            exit 1
          elif grep -q "LINTING RESULTS" pynblint_report.txt; then
            echo "pynblint found violations."
            exit 1
          fi
          echo "No violations."

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pynblint-report
          path: pynblint_report.txt
