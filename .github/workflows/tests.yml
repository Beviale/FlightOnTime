name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync

      - name: Run the unit tests
        run: uv run pytest tests/test_predicting_flight_arrival_delays -q

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync

      # The remote is an HTTP one (https://dagshub.com/.../FlightOnTime.dvc), not an
      # S3 bucket, so it takes basic auth and not access keys. The token goes in as
      # the password; the username is already public in that URL.
      #
      # The guard is worth its four lines: an unset secret expands to nothing, the
      # value is written empty, and DVC reports it as "expected str for dictionary
      # value @ data['remote']['origin']['password']" - which says nothing about the
      # secret being the thing that is missing.
      - name: Configure DVC credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DAGSHUB_TOKEN}" ]; then
            echo "The DAGSHUB_TOKEN secret is empty or not set."
            echo "Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user Beviale
          uv run dvc remote modify origin --local password "${DAGSHUB_TOKEN}"

 
      - name: Pull the data the suites read
        run: |
          uv run dvc pull data/raw
          uv run dvc pull data/interim/flights_preprocessed.parquet
          uv run dvc pull data/processed/selection


      - name: Run the data and behavioural tests
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: uv run pytest tests/test_flight_data tests/test_behavioral_model -q


      - name: Validate the data with Great Expectations
        run: |
          set -euo pipefail
          uv run python tests/test_flight_data/raw_test.py
          uv run python tests/test_flight_data/processed_test.py
