name: Lint (Ruff)

on:
  pull_request:

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync --no-default-groups --group dev


      - name: Fix what can be fixed
        run: uv run ruff check --fix --exit-zero .


      - name: Format
        run: uv run ruff format .

      - name: Push the fixes back onto the branch
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to fix."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply ruff fixes and formatting"
          git push origin HEAD:${{ github.head_ref }}


      - name: Fail on what is left
        run: uv run ruff check .
