logistic_regression:
  default:
    max_iter: 1000
  weak_l2:
    max_iter: 1000
    C: 10.0
  strong_l2:
    max_iter: 1000
    C: 0.1
  elasticnet:
    max_iter: 1000
    C: 1.0
    penalty: elasticnet
    solver: saga
    l1_ratio: 0.5

random_forest:
  default:
    n_estimators: 200
    min_samples_leaf: 20
    random_state: 42
    n_jobs: -1
  deep:
    n_estimators: 300
    min_samples_leaf: 5
    random_state: 42
    n_jobs: -1
  shallow:
    n_estimators: 300
    min_samples_leaf: 20
    max_depth: 10
    max_features: sqrt
    random_state: 42
    n_jobs: -1

lightgbm:
  default:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    random_state: 42
    verbose: -1
    n_jobs: -1
    early_stopping_rounds: 50
  fast:
    n_estimators: 200
    learning_rate: 0.1
    num_leaves: 31
    random_state: 42
    verbose: -1
    n_jobs: -1
    early_stopping_rounds: 50
  deep:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 127
    random_state: 42
    verbose: -1
    n_jobs: -1
    early_stopping_rounds: 50
  regularised:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    reg_lambda: 5.0
    random_state: 42
    verbose: -1
    n_jobs: -1
    early_stopping_rounds: 50