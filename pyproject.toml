[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "predicting_flight_arrival_delays"
version = "0.0.1"
description = "Predicting Arrival Delays in Commercial Flights"
authors = [
  { name = "Alessandro Bevilacqua" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "dagshub>=0.7.1",
    "fastapi>=0.120.0",
    "gradio>=5.49.1",
    "holidays>=0.101",
    "httpx>=0.28.1",
    "imbalanced-learn>=0.14.2",
    "joblib",
    "lightgbm>=4.7.0",
    "loguru",
    "matplotlib",
    "mlflow-skinny>=3.15.1",
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "shap>=0.52.0",
    "tqdm",
    "typer",
    "uvicorn>=0.38.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["predicting_flight_arrival_delays"]
include = ["pyproject.toml", "predicting_flight_arrival_delays/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting
ignore = [
    "B008",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]

"tests/**/*.py" = ["DTZ001", "DTZ011"]

[tool.ruff.lint.isort]
known-first-party = ["predicting_flight_arrival_delays"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# The interface talks to the API over HTTP, so its functions are async.
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*DataFrame with sparse columns found.*:UserWarning",
    "ignore:X has feature names, but .* was fitted without feature names:UserWarning",
]

[tool.coverage.run]
# Without an explicit source, modules no test ever imports are simply absent
# from the report instead of showing up as 0%.
source = ["predicting_flight_arrival_delays"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[dependency-groups]
pipeline = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "mlflow>=3.15.1",
    "pip",
    "playwright>=1.62.0",
    "pyarrow>=25.0.0",
    "timezonefinder>=8.2.5",
]
notebooks = [
    "ipython",
    "jupyterlab",
    "notebook",
    "seaborn>=0.13.2",
]
dev = [
    "click<8.2",
    "great-expectations>=1.21.0",
    "pynblint>=0.1.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv]
default-groups = ["dev", "pipeline", "notebooks"]

