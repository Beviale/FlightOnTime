      md5: 42950f147717ce17d821609843fadba5
      size: 13373
    params:
      predicting_flight_arrival_delays/config.py:
        DATE_COLUMN: FlightDate
        FULL_LEAD_COVERAGE_START: '2024-12-01'
        KEEP_COLUMNS:
        - OriginAirportID
        - DestAirportID
        - Origin
        - Dest
        - Reporting_Airline
        - Flight_Number_Reporting_Airline
        - FlightDate
        - CRSDepTime
        - CRSArrTime
        - CRSElapsedTime
