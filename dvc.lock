      size: 11481
    params:
      predicting_flight_arrival_delays/config.py:
        DATE_COLUMN: FlightDate
        FULL_LEAD_COVERAGE_START: '2024-12-01'
        KEEP_COLUMNS:
        - OriginAirportID
        - DestAirportID
        - Origin
        - Dest
